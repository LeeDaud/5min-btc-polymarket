version: 3
name: btc_5m_signal_quality_profiles
market: polymarket_btc_updown_5m

# Optimization notes (2026-06-22 backtest, 99 slots, BTC 5-min sigma=$90):
#   Baseline:            thresh=0.70 max_ask=1.0  sl=25% min_move=$40 -> 74 trades, 67.6% win, cum +248.82%, sharpe 0.248
#   Optimized #1 (best): thresh=0.75 max_ask=0.92 sl=15% min_move=$30 -> 55 trades, 70.9% win, cum +346.92%, sharpe 0.484
#   Optimized #2 (bal):  thresh=0.70 max_ask=0.92 sl=20% min_move=$40 -> 50 trades, 74.0% win, cum +309.59%, sharpe 0.440

strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 30
  btc_move_usd_max_reference: 100
  max_entry_price_note: "Do NOT enter if CLOB ask > max_entry_price - insufficient upside remains."
  skew_bias_note: "Prefer direction supported by market skew when momentum is already established."
  sizing_note: "Typical discretionary sizing can be up to ~50% of allocated trading balance; tune risk per user preference."
  optional_hedge_note: "When skew is extreme (for example >=95/5), allow a small opposite hedge to reduce last-second reversal risk."

shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots: ["prev", "current", "next", "next2"]
    choose: "closest_valid"
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: "skip"
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 60
    exit_before_sec: 40

profiles:
  conservative:
    description: "Higher quality entries with BTC signal confirmation. Tight stop, moderate momentum."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.72
      max_entry_price: 0.88
      min_btc_move_usd: 30
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 1.0
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 20
    hedge:
      enabled: false
      hedge_ratio: 0.0
    trail_stop:
      enabled: true
      trail_stop_pct: 0.07
    take_profit:
      enabled: true
      tp_partial_pct: 0.20
      tp_partial_ratio: 0.50
      take_profit_pct: 0.0
    emergency_exit:
      enabled: true
      exit_sec: 15
    btc_signal_quality:
      enabled: true
      window_delta_min_tier: "WEAK"
      require_micro_momentum: true
      atr_filter_multiplier: 1.5
      min_confidence: 30
    dynamic_sizing:
      enabled: false
      max_position_usd: 5.0
      base_fraction: 0.05
      confidence_multiplier: 0.10
      late_window_boost: true

  aggressive:
    description: "More entries, earlier momentum catch, looser BTC filters."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.68
      max_entry_price: 0.90
      min_btc_move_usd: 30
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 1.0
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      max_trades_per_day: 20
    hedge:
      enabled: false
      hedge_ratio: 0.0
    trail_stop:
      enabled: true
      trail_stop_pct: 0.10
    take_profit:
      enabled: true
      tp_partial_pct: 0.25
      tp_partial_ratio: 0.50
      take_profit_pct: 0.0
    emergency_exit:
      enabled: true
      exit_sec: 15
    btc_signal_quality:
      enabled: true
      window_delta_min_tier: "WEAK"
      require_micro_momentum: false
      atr_filter_multiplier: 2.0
      min_confidence: 25
    dynamic_sizing:
      enabled: false
      max_position_usd: 5.0
      base_fraction: 0.05
      confidence_multiplier: 0.10
      late_window_boost: true

runner_mapping:
  script: "scripts/test_btc_5m_session_exit_sl.py"
  direct_flags_now_supported:
    - "--threshold"
    - "--max-entry-price"
    - "--stake-usd"
    - "--stop-loss-pct"
    - "--exit-before-sec"
    - "--min-entry-seconds-left"
    - "--entry-timeout-min"
    - "--poll-sec"
    - "--execute"
    - "--enable-btc-signal"
    - "--btc-delta-min-tier"
    - "--btc-min-confidence"
    - "--btc-atr-multiplier"
    - "--enable-dynamic-sizing"
    - "--max-position-usd"

notes:
  - "v3: Added BTC signal quality filters (window delta, micro-momentum, ATR, confidence scoring) and dynamic position sizing."
  - "v2: Optimized parameters from 99-slot backtest. max_entry_price is the critical parameter."
  - "Current 5m runner uses threshold/side-strength logic with optional BTC signal confirmation."
  - "Entry behavior: CLOB ask >= threshold AND ask <= max_entry_price, then BTC delta/momentum/ATR gates confirm."
  - "Backtest script at 026-polymarket/optimize_params.py; re-run periodically as BTC volatility regime changes."

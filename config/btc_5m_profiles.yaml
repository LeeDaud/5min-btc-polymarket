version: 2
name: btc_5m_impulse_momentum_profiles
market: polymarket_btc_updown_5m

# Optimization notes (2026-06-22 backtest, 99 slots, BTC 5-min σ=$90):
#   Baseline:            thresh=0.70 max_ask=1.0  sl=25% min_move=$40 → 74 trades, 67.6% win, cum +248.82%, sharpe 0.248
#   Optimized #1 (best): thresh=0.75 max_ask=0.92 sl=15% min_move=$30 → 55 trades, 70.9% win, cum +346.92%, sharpe 0.484
#   Optimized #2 (bal):  thresh=0.70 max_ask=0.92 sl=20% min_move=$40 → 50 trades, 74.0% win, cum +309.59%, sharpe 0.440
#
# Key improvements over original:
#   1. max_entry_price cap (0.92): filters near-certainty entries (ask > 0.92) with no upside
#   2. Tighter stop-loss (15-20% vs 25-30%): each loss is smaller, net -15%×12 < -25%×9
#   3. Higher threshold (0.75 conservative): better entry quality
#   4. Lower min_btc_move (30-40): enter earlier in momentum, better entry price

strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 30
  btc_move_usd_max_reference: 100
  max_entry_price_note: "Do NOT enter if CLOB ask > max_entry_price — insufficient upside remains."
  skew_bias_note: "Prefer direction supported by market skew when momentum is already established."
  sizing_note: "Typical discretionary sizing can be up to ~50% of allocated trading balance; tune risk per user preference."
  optional_hedge_note: "When skew is extreme (for example >=95/5), allow a small opposite hedge to reduce last-second reversal risk."

shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots: ["prev", "current", "next", "next2"]
    choose: "closest_valid"
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: "skip"
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 60
    exit_before_sec: 20

profiles:
  conservative:
    description: "Higher quality entries, tight stop, moderate momentum requirement. After optimization."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.75
      max_entry_price: 0.92
      min_btc_move_usd: 40
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 12
    hedge:
      enabled: true
      trigger_side_price_gte: 0.95
      trigger_seconds_left_lte: 45
      hedge_share_of_main_pct: 3
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 2
    trail_stop:
      enabled: true
      trail_stop_pct: 0.15
      note: "Starts at entry*(1-pct)=initial SL, rises with peak, locks profit"

  aggressive:
    description: "More entries, earlier momentum catch, moderate stop. After optimization."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
      max_entry_price: 0.92
      min_btc_move_usd: 30
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      max_trades_per_day: 20
    hedge:
      enabled: true
      trigger_side_price_gte: 0.93
      trigger_seconds_left_lte: 50
      hedge_share_of_main_pct: 5
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 3
    trail_stop:
      enabled: true
      trail_stop_pct: 0.20
      note: "Starts at entry*(1-pct)=initial SL, rises with peak, locks profit"

runner_mapping:
  script: "skills/btc-5m-live/scripts/test_btc_5m_session_exit_sl.py"
  direct_flags_now_supported:
    - "--threshold"
    - "--max-entry-price"
    - "--stake-usd"
    - "--stop-loss-pct"
    - "--exit-before-sec"
    - "--min-entry-seconds-left"
    - "--entry-timeout-min"
    - "--poll-sec"
    - "--execute"
  example_conservative_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.75 --stake-usd 4 --stop-loss-pct 0.15 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"
  example_aggressive_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 6 --stop-loss-pct 0.20 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"

notes:
  - "v2: Optimized parameters from 99-slot backtest. max_entry_price is the new critical parameter."
  - "Current 5m runner uses threshold/side-strength logic; impulse filter integration can be extended at strategy layer."
  - "Entry behavior: continuous CLOB ask monitoring; if UP/DOWN ask >= threshold AND ask <= max_entry_price, enter on stronger side."
  - "Backtest script at 026-polymarket/optimize_params.py; re-run periodically as BTC volatility regime changes."
